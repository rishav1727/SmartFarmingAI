services:
  - type: web
    name: smartfarming-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/model/info
    envVars:
      - fromGroup: DATABASE_URL
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: training-contributions
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL_REPO
        sync: false
      - key: WEIGHTS_URL
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: USE_CUDA
        value: "0"
      - key: LOW_MEMORY_MODE
        value: "1"
      - key: BASE_URL
        sync: false


